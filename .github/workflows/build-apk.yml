name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave empty for auto-increment)'
        required: false
        type: string

jobs:
  validate:
    name: Pre-build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: false

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS
        run: npx eas build --platform android --non-interactive

      - name: Wait for build to complete
        run: |
          BUILD_ID=$(npx eas build:list --limit 1 --platform android --json | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"
          
          # Poll for build status (max 30 minutes)
          for i in {1..360}; do
            STATUS=$(npx eas build:view $BUILD_ID --json | jq -r '.status')
            echo "Build status: $STATUS"
            
            if [ "$STATUS" = "FINISHED" ]; then
              echo "Build completed successfully!"
              exit 0
            elif [ "$STATUS" = "ERRORED" ]; then
              echo "Build failed!"
              exit 1
            fi
            
            sleep 5
          done
          
          echo "Build timeout!"
          exit 1

      - name: Download APK
        run: |
          BUILD_ID=$(npx eas build:list --limit 1 --platform android --json | jq -r '.[0].id')
          npx eas build:download --id $BUILD_ID --path ./app-release.apk
          ls -lh ./app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardgamescounter-apk
          path: ./app-release.apk
          retention-days: 30

      - name: Comment on PR (if triggered by PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ APK build completed! Download from [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ APK build failed! Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

