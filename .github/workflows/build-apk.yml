name: Build APK

# Déclenché par un tag de version (v1.2.8) ou manuellement depuis l'onglet Actions.
# Le build lui-même tourne sur les serveurs EAS (Expo) : chaque exécution consomme
# un build du quota de votre plan EAS. Voir docs/DEPLOYMENT.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate (files, typecheck, lint, tests, versions)
        run: npm run validate

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME}" != "v${APP_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ne correspond pas à app.json (v${APP_VERSION})"
            exit 1
          fi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write # nécessaire pour créer la GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS (waits for completion)
        run: |
          npx eas build --platform android --profile production \
            --non-interactive --wait --json > build.json
          cat build.json

      - name: Download APK
        run: |
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::Aucune URL d'artefact dans la réponse EAS"
            exit 1
          fi
          curl -fsSL "$APK_URL" -o boardgamescounter.apk
          ls -lh boardgamescounter.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: boardgamescounter.apk
          generate_release_notes: true

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardgamescounter-apk
          path: boardgamescounter.apk
          retention-days: 30
